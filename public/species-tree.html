<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Biosim Species Tree</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&family=JetBrains+Mono:wght@400;500&family=Space+Grotesk:wght@500;600&display=swap">
<style>
/* A timeline of species: one band per species, as thick as its living creatures, branching from its parent species. */
:root {
  --bg: #f3f6f4;
  --surface: #ffffff;
  --sunken: #eaefec;
  --fg: #15201b;
  --muted: #5b6a63;
  --line: #d6dfda;
  --accent: #2a68a8;
  --plant: #2c8549;
  --herb: #2a68a8;
  --carn: #b9442b;
  --unknown: #8a948f;
  --font-display: "Space Grotesk", "Segoe UI", system-ui, sans-serif;
  --font-body: "Inter", "Segoe UI", system-ui, sans-serif;
  --font-mono: "JetBrains Mono", ui-monospace, "Cascadia Mono", Consolas, monospace;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --bg: #0e1412; --surface: #161f1b; --sunken: #111916; --fg: #e3ebe6; --muted: #93a39b; --line: #2a3631;
    --accent: #6ea6e4; --plant: #5cc27c; --herb: #6ea6e4; --carn: #e7765c; --unknown: #8d9892; color-scheme: dark;
  }
}
:root[data-theme="dark"] {
  --bg: #0e1412; --surface: #161f1b; --sunken: #111916; --fg: #e3ebe6; --muted: #93a39b; --line: #2a3631;
  --accent: #6ea6e4; --plant: #5cc27c; --herb: #6ea6e4; --carn: #e7765c; --unknown: #8d9892; color-scheme: dark;
}
* { box-sizing: border-box; }
html { scrollbar-gutter: stable; }  /* the page scrollbar coming and going would change the width of the tree */
body { margin: 0; background: var(--bg); color: var(--fg); font: 14px/1.45 var(--font-body); }
main { max-width: 1400px; margin: 0 auto; padding: 20px 16px 40px; display: flex; flex-direction: column; gap: 14px; }
h1 { font: 600 22px/1.2 var(--font-display); margin: 0; }
.sub { color: var(--muted); margin: 2px 0 0; }
.panel { background: var(--surface); border: 1px solid var(--line); border-radius: 10px; padding: 12px 14px; }
.drop { display: flex; flex-wrap: wrap; align-items: center; gap: 10px 16px; }
.drop.over { outline: 2px dashed var(--accent); outline-offset: -4px; }
.controls { display: flex; flex-wrap: wrap; gap: 10px 20px; align-items: end; }
label { display: flex; flex-direction: column; gap: 3px; font-size: 12px; color: var(--muted); }
label.check { flex-direction: row; align-items: center; gap: 6px; color: var(--fg); font-size: 13px; }
input, select, button { font: inherit; color: var(--fg); }
select, input[type="number"] { background: var(--sunken); border: 1px solid var(--line); border-radius: 6px; padding: 4px 6px; }
input[type="number"] { width: 6em; }
button { background: var(--sunken); border: 1px solid var(--line); border-radius: 6px; padding: 5px 10px; cursor: pointer; }
.status { color: var(--muted); font-size: 13px; }
.mono { font-family: var(--font-mono); font-size: 12px; }
#chartWrap { overflow: auto; max-height: 75vh; position: relative; padding: 0; scrollbar-gutter: stable; }
#chart { display: block; }
#chart .band { cursor: pointer; }
#chart .dim { opacity: 0.15; }
.axis text { fill: var(--muted); font: 11px var(--font-body); }
.axis line, .axis path { stroke: var(--line); }
#tip { position: fixed; pointer-events: none; background: var(--surface); border: 1px solid var(--line); border-radius: 8px;
  padding: 6px 8px; font-size: 12px; box-shadow: 0 4px 14px #0003; display: none; z-index: 10; max-width: 320px; }
#details { display: flex; flex-direction: column; gap: 14px; }
#details h2 { font: 600 16px/1.3 var(--font-display); margin: 0; display: flex; flex-wrap: wrap; align-items: center; gap: 8px; }
#details h3 { font: 600 13px/1.3 var(--font-display); margin: 0 0 6px; color: var(--muted); text-transform: uppercase; letter-spacing: 0.04em; }
#details dl { display: grid; grid-template-columns: max-content 1fr; gap: 2px 12px; margin: 0; }
#details dt { color: var(--muted); }
#details dd { margin: 0; overflow-wrap: anywhere; }
.cols { display: grid; grid-template-columns: repeat(auto-fit, minmax(300px, 1fr)); gap: 14px 24px; }
.swatch { display: inline-block; width: 12px; height: 12px; border-radius: 3px; vertical-align: -1px; margin-right: 5px; border: 1px solid var(--line); }
.chips { display: flex; flex-wrap: wrap; gap: 4px; }
.chip { background: var(--sunken); border: 1px solid var(--line); border-radius: 999px; padding: 1px 8px; font-size: 12px; }
.link { background: none; border: none; padding: 0; color: var(--accent); cursor: pointer; text-decoration: underline; font: 12px var(--font-mono); }
.genome { background: var(--sunken); border: 1px solid var(--line); border-radius: 6px; padding: 6px 8px; margin: 0; white-space: pre-wrap; word-break: break-all; max-height: 8em; overflow: auto; }
.tableWrap { overflow: auto; max-height: 50vh; border: 1px solid var(--line); border-radius: 6px; }
table { border-collapse: collapse; font: 12px var(--font-mono); white-space: nowrap; }
th, td { padding: 3px 8px; text-align: right; border-bottom: 1px solid var(--line); }
th { position: sticky; top: 0; background: var(--sunken); font-weight: 500; color: var(--muted); cursor: pointer; }
th.current { color: var(--accent); }
td.current { background: color-mix(in srgb, var(--accent) 10%, transparent); }
.rowsTools { display: flex; flex-wrap: wrap; gap: 8px 16px; align-items: end; margin-bottom: 6px; }
#metricChart { display: block; width: 100%; }
#metricChart .line { fill: none; stroke: var(--accent); stroke-width: 1.5; }
#metricChart .dot { fill: var(--accent); }
#find { width: 14em; }
.view { display: flex; flex-direction: column; gap: 14px; min-width: 0; }
/* wide screens: the details are a side panel next to the tree, scrolling on their own */
@media (min-width: 1100px) {
  main:has(.view.open) { max-width: 1900px; }
  .view.open { display: grid; grid-template-columns: minmax(0, 1fr) clamp(420px, 34vw, 620px); align-items: start; }
  .view.open #chartWrap { max-height: calc(100vh - 32px); position: sticky; top: 16px; }
  .view.open #details { position: sticky; top: 16px; max-height: calc(100vh - 32px); overflow: auto; }
  .view.open #details .cols { grid-template-columns: 1fr; }
}
.constants { columns: 240px; column-gap: 24px; }
.constants > div { break-inside: avoid; display: flex; justify-content: space-between; gap: 10px; border-bottom: 1px dotted var(--line); }
.legend { display: flex; flex-wrap: wrap; gap: 12px; font-size: 12px; color: var(--muted); }
.legend span::before { content: ""; display: inline-block; width: 10px; height: 10px; border-radius: 2px; margin-right: 5px; background: var(--c); vertical-align: -1px; }
.empty { color: var(--muted); padding: 30px 10px; text-align: center; }
</style>
</head>
<body>
<main>
  <header>
    <h1>Species tree</h1>
    <p class="sub">Each species is a band as thick as its living creatures, branching from the species it came from. Load the <span class="mono">species.csv</span> of a log recorded from generation 1 with <b>All</b> (Simulation → Log).</p>
  </header>

  <section class="panel drop" id="drop">
    <input type="file" id="file" accept=".csv,text/csv">
    <span class="status" id="fileStatus">Or drop the file here.</span>
  </section>

  <section class="panel controls" id="controls" hidden>
    <label>Run <select id="run"></select></label>
    <label>Thickness <select id="metric">
      <option value="alive">alive (at each row)</option>
      <option value="peakAlive">peakAlive (most at once)</option>
    </select></label>
    <label>Hide species with fewer than <input type="number" id="minPeak" min="1" value="5"></label>
    <label class="check"><input type="checkbox" id="merge" checked> add hidden species to their visible ancestor</label>
    <label>Scale (px per creature) <input type="range" id="scale" min="0.05" max="4" step="0.05" value="0.6"></label>
    <label>Colour <select id="colour">
      <option value="genus">genus</option>
      <option value="genome">genome colour</option>
    </select></label>
    <label class="check"><input type="checkbox" id="parentLinks" checked> lines to the parent</label>
    <label>Find species (start of its id) <input type="search" id="find" class="mono" list="findList" placeholder="0a1b…" spellcheck="false"></label>
    <datalist id="findList"></datalist>
  </section>

  <section class="panel" id="summary" hidden>
    <div class="status" id="counts"></div>
    <div class="legend" id="legend">
      <span style="--c: var(--plant)">plant</span><span style="--c: var(--herb)">animal</span>
      <span style="--c: var(--carn)">carnivore</span><span style="--c: var(--unknown)">unknown</span>
    </div>
  </section>

  <div class="view" id="view">
    <section class="panel" id="chartWrap"><div class="empty" id="empty">No file loaded.</div><svg id="chart" hidden></svg></section>
    <section class="panel" id="details" hidden></section>
  </div>
</main>
<div id="tip"></div>

<script>
"use strict";
const $ = (id) => document.getElementById(id);
const SVG_NS = "http://www.w3.org/2000/svg";
const GENUS_VAR = { plant: "--plant", attack_plant: "--herb", attack_animal: "--carn", unknown: "--unknown" };
const GENUS_LABEL = { plant: "plant", attack_plant: "animal", attack_animal: "carnivore", unknown: "unknown" };
const LANE_GAP = 3;
const MIN_LANE = 2;
const MARGIN = { left: 12, right: 16, top: 8, bottom: 28 };

let rows = [];          // all parsed rows
let header = [];        // the columns of the file, in its order
let selected = null;    // speciesId whose lineage is highlighted
let currentSpecies = new Map();  // the species of the run on screen
let detailMetric = "alive";      // the column drawn in the details
let detailSort = null;           // column the rows of the details are sorted by, null: by time

// numbers of the log use the locale of the recording: "1,5" (es-ES) or "1.5" (en-US), never thousands separators
const num = (text) => text === "" || text === undefined ? NaN : Number(text.replace(",", "."));

function parseCsv(text) {
  const lines = text.split(/\r?\n/).filter((line) => line.length > 0);
  if (lines.length < 2) throw new Error("the file has no rows");
  header = lines[0].split(";");
  for (const column of ["generation", "step", "speciesId", "speciesParentId", "alive"]) {
    if (!header.includes(column)) throw new Error(`no column "${column}": is it the species file of the log?`);
  }
  const index = Object.fromEntries(header.map((name, i) => [name, i]));
  return lines.slice(1).map((line) => {
    const c = line.split(";");
    return {
      run: c[index.simCode] ?? "",
      generation: num(c[index.generation]),
      step: num(c[index.step]),
      id: c[index.speciesId],
      parent: c[index.speciesParentId] || null,
      firstGen: num(c[index.firstGen]),
      genus: c[index.genus] || "unknown",
      color: c[index.genomeColor] || "",
      genomeSize: num(c[index.genomeSize]),
      alive: num(c[index.alive]) || 0,
      peakAlive: num(c[index.peakAlive]) || 0,
      usedActions: c[index.usedActions] ?? "",
      usedSensors: c[index.usedSensors] ?? "",
      genome: c[index.genome] ?? "",
      cells: c,           // every column, for the details
    };
  });
}

function load(text, name) {
  try {
    rows = parseCsv(text);
  } catch (error) {
    $("fileStatus").textContent = `Cannot read ${name}: ${error.message}.`;
    return;
  }
  selected = null;
  const runs = [...new Set(rows.map((row) => row.run))];
  $("run").innerHTML = runs.map((run) => `<option value="${run}">${run || "(no code)"}</option>`).join("");
  $("fileStatus").textContent = `${name}: ${rows.length} rows, ${runs.length} run${runs.length === 1 ? "" : "s"}.`;
  $("controls").hidden = false;
  $("summary").hidden = false;
  render();
}

// the species of one run, with their points in time
function buildSpecies(runRows, metric) {
  const maxStep = Math.max(...runRows.map((row) => row.step));
  const species = new Map();
  for (const row of runRows) {
    let s = species.get(row.id);
    if (!s) {
      s = { id: row.id, parent: row.parent, genus: row.genus, color: row.color, genomeSize: row.genomeSize,
        firstGen: row.firstGen, peak: 0, points: new Map(), usedActions: row.usedActions, usedSensors: row.usedSensors,
        genome: row.genome, rows: [] };
      species.set(row.id, s);
    }
    // generation 3 step 300 of 300 is x = 3; rows every N steps fall between generations
    const x = row.generation - 1 + row.step / maxStep;
    s.rows.push({ x, row });
    s.points.set(x, (s.points.get(x) ?? 0) + row[metric]);
    s.peak = Math.max(s.peak, row.peakAlive, row.alive);
  }
  return species;
}

function render() {
  const run = $("run").value;
  const metric = $("metric").value;
  const minPeak = Math.max(1, Number($("minPeak").value) || 1);
  const merge = $("merge").checked;
  const scale = Number($("scale").value);
  const species = buildSpecies(rows.filter((row) => row.run === run), metric);
  $("findList").innerHTML = [...species.values()].sort((a, b) => b.peak - a.peak).slice(0, 500)
    .map((s) => `<option value="${s.id}">most at once ${s.peak}</option>`).join("");
  currentSpecies = species;
  if (selected && !species.has(selected)) selected = null;
  // open or close the side panel before measuring the width of the tree
  $("view").classList.toggle("open", selected !== null);
  $("details").hidden = selected === null;

  const visible = (s) => s.peak >= minPeak;
  const visibleAncestor = (s) => {
    let id = s.parent;
    for (let guard = 0; id && guard < 100000; guard++) {
      const parent = species.get(id);
      if (!parent) return null;            // came from a species before the recording started
      if (visible(parent)) return parent;
      id = parent.parent;
    }
    return null;
  };

  // series of the visible species, with the hidden ones added to their ancestor
  const shown = [...species.values()].filter(visible);
  const series = new Map(shown.map((s) => [s.id, new Map(s.points)]));
  let hiddenCount = 0;
  for (const s of species.values()) {
    if (visible(s)) continue;
    hiddenCount++;
    if (!merge) continue;
    const ancestor = visibleAncestor(s);
    if (!ancestor) continue;
    const target = series.get(ancestor.id);
    for (const [x, v] of s.points) if (target.has(x)) target.set(x, target.get(x) + v);
  }

  // the tree of visible species: children below their parent, the oldest first
  const children = new Map();
  const roots = [];
  for (const s of shown) {
    const parent = visibleAncestor(s);
    s.visibleParent = parent;
    if (parent) {
      if (!children.has(parent.id)) children.set(parent.id, []);
      children.get(parent.id).push(s);
    } else roots.push(s);
  }
  const firstX = (s) => Math.min(...series.get(s.id).keys());
  const byStart = (a, b) => firstX(a) - firstX(b) || b.peak - a.peak;
  const order = [];
  const visit = (s) => { order.push(s); for (const child of (children.get(s.id) ?? []).sort(byStart)) visit(child); };
  for (const root of roots.sort(byStart)) visit(root);

  $("counts").textContent = `${species.size} species in this run; ${shown.length} shown, ${hiddenCount} with fewer than ${minPeak} creatures hidden`
    + (merge ? " (their creatures are added to their nearest shown ancestor)." : ".");

  const svg = $("chart");
  svg.innerHTML = "";
  if (order.length === 0) {
    svg.hidden = true;
    $("empty").hidden = false;
    $("empty").textContent = "No species with that many creatures: lower the filter.";
    showDetails();
    return;
  }
  svg.hidden = false;
  $("empty").hidden = true;

  // lanes: each species gets the height of its thickest moment
  let y = MARGIN.top;
  for (const s of order) {
    const max = Math.max(...series.get(s.id).values());
    const height = Math.max(MIN_LANE, max * scale);
    s.yc = y + height / 2;
    y += height + LANE_GAP;
  }
  const height = y + MARGIN.bottom;
  const allX = [...species.values()].flatMap((s) => [...s.points.keys()]);
  const minX = Math.min(0, ...allX), maxX = Math.max(...allX);
  const width = Math.max(320, $("chartWrap").clientWidth - 2);
  const sx = (x) => MARGIN.left + ((x - minX) / Math.max(1e-9, maxX - minX)) * (width - MARGIN.left - MARGIN.right);
  svg.setAttribute("width", width);
  svg.setAttribute("height", height);
  svg.setAttribute("viewBox", `0 0 ${width} ${height}`);

  const styles = getComputedStyle(document.documentElement);
  $("legend").hidden = $("colour").value === "genome";
  const colourOf = (s) => $("colour").value === "genome" && s.color ? s.color : styles.getPropertyValue(GENUS_VAR[s.genus] ?? "--unknown").trim();
  const lineage = selected ? lineageOf(selected, species) : null;

  // grid lines and generation axis
  const axis = el("g", { class: "axis" });
  const ticks = niceTicks(minX, maxX, Math.floor(width / 70));
  for (const t of ticks) {
    axis.append(el("line", { x1: sx(t), x2: sx(t), y1: MARGIN.top, y2: height - MARGIN.bottom + 4 }));
    const label = el("text", { x: sx(t), y: height - 10, "text-anchor": "middle" });
    label.textContent = t;
    axis.append(label);
  }
  svg.append(axis);

  for (const s of order) {
    const points = [...series.get(s.id).entries()].sort((a, b) => a[0] - b[0]);
    const colour = colourOf(s);
    const dim = lineage && !lineage.has(s.id) ? "dim" : "";
    const group = el("g", { class: dim });
    if ($("parentLinks").checked && s.visibleParent) {
      const x = sx(points[0][0]);
      group.append(el("line", { x1: x, x2: x, y1: s.visibleParent.yc, y2: s.yc, stroke: colour, "stroke-width": 1, "stroke-opacity": 0.7 }));
    }
    // a band centred on the lane: the top edge forwards, the bottom edge back; a lone point gets a short width
    const half = (v) => Math.max(0.5, (v * scale) / 2);
    let d;
    if (points.length === 1) {
      const [x, v] = points[0];
      d = `M${sx(x) - 2},${s.yc - half(v)}h4v${2 * half(v)}h-4z`;
    } else {
      d = "M" + points.map(([x, v]) => `${sx(x).toFixed(1)},${(s.yc - half(v)).toFixed(1)}`).join("L")
        + "L" + points.slice().reverse().map(([x, v]) => `${sx(x).toFixed(1)},${(s.yc + half(v)).toFixed(1)}`).join("L") + "Z";
    }
    const band = el("path", { d, fill: colour, class: "band" });
    band.addEventListener("mousemove", (event) => showTip(event, s, points));
    band.addEventListener("mouseleave", () => { $("tip").style.display = "none"; });
    band.addEventListener("click", () => select(selected === s.id ? null : s.id));
    group.append(band);
    svg.append(group);
  }
  showDetails();
}

// selects a species (null clears) and shows its details
function select(id, scroll = false) {
  if (id !== selected) detailSort = null;
  selected = id;
  render();
  if (!id) return;
  $("details").scrollTop = 0;
  // a side panel is already in view; below the tree, scroll down to it
  if (scroll && getComputedStyle($("details")).position !== "sticky") $("details").scrollIntoView({ behavior: "smooth", block: "start" });
}

// the species, its ancestors and its descendants
function lineageOf(id, species) {
  const set = new Set([id]);
  for (let s = species.get(id); s && s.parent; s = species.get(s.parent)) set.add(s.parent);
  const children = new Map();
  for (const s of species.values()) {
    if (!s.parent) continue;
    if (!children.has(s.parent)) children.set(s.parent, []);
    children.get(s.parent).push(s.id);
  }
  const queue = [id];
  while (queue.length > 0) {
    for (const child of children.get(queue.pop()) ?? []) {
      if (!set.has(child)) { set.add(child); queue.push(child); }
    }
  }
  return set;
}

function showTip(event, s, points) {
  const tip = $("tip");
  const first = points[0][0], last = points[points.length - 1][0];
  tip.innerHTML = `<div class="mono">${s.id}</div>`
    + `${GENUS_LABEL[s.genus] ?? s.genus}, ${s.genomeSize} genes · most at once ${s.peak}<br>`
    + `generations ${fmt(first)} to ${fmt(last)}`
    + (s.parent ? `<br>from <span class="mono">${s.parent}</span>` : "<br>root species");
  tip.style.display = "block";
  const x = Math.min(event.clientX + 14, window.innerWidth - tip.offsetWidth - 8);
  tip.style.left = `${x}px`;
  tip.style.top = `${event.clientY + 14}px`;
}

// columns shown apart from the table of rows
const SHOWN_APART = new Set(["simCode", "speciesId", "speciesParentId", "firstGen", "genus", "genomeColor", "genomeSize",
  "usedSensors", "usedActions", "genome", "aliveCreatures"]);

// everything the file has about the selected species
function showDetails() {
  const panel = $("details");
  const species = currentSpecies;
  const s = selected ? species.get(selected) : null;
  if (!s) { panel.hidden = true; panel.innerHTML = ""; return; }
  panel.hidden = false;

  const entries = s.rows.slice().sort((a, b) => a.x - b.x);
  const col = Object.fromEntries(header.map((name, i) => [name, i]));
  const cell = (entry, name) => col[name] === undefined ? "" : (entry.row.cells[col[name]] ?? "");
  const value = (entry, name) => num(cell(entry, name));
  const has = (name) => col[name] !== undefined;

  // the last row of each generation holds its totals (born, died... count from the start of the generation)
  const byGen = new Map();
  for (const entry of entries) {
    const last = byGen.get(entry.row.generation);
    if (!last || entry.row.step >= last.row.step) byGen.set(entry.row.generation, entry);
  }
  const genEnds = [...byGen.values()];
  const sum = (name) => genEnds.reduce((total, e) => total + (value(e, name) || 0), 0);
  const totalBorn = sum("born"), totalDied = sum("died");
  const weightedByDeaths = (name) => {
    let weight = 0, total = 0;
    for (const e of genEnds) {
      const died = value(e, "died") || 0, v = value(e, name);
      if (died > 0 && !Number.isNaN(v)) { weight += died; total += died * v; }
    }
    return weight > 0 ? total / weight : NaN;
  };

  // lineage: ancestors up to the root, and the species that came from it
  const ancestors = [];
  for (let id = s.parent, guard = 0; id && guard < 100000; guard++) {
    ancestors.push(id);
    const parent = species.get(id);
    if (!parent) break;
    id = parent.parent;
  }
  const children = [...species.values()].filter((other) => other.parent === s.id).sort((a, b) => b.peak - a.peak);
  let descendants = 0;
  for (const id of lineageOf(s.id, species)) if (id !== s.id && !ancestors.includes(id)) descendants++;

  const idLink = (id) => species.has(id)
    ? `<button class="link" data-species="${id}">${id}</button>` : `<span class="mono">${id}</span> <span class="status">(not in the file)</span>`;
  const chips = (text) => text ? `<div class="chips">${text.split("|").map((t) => `<span class="chip">${esc(t)}</span>`).join("")}</div>` : `<span class="status">none</span>`;
  const n = (v, digits = 2) => Number.isNaN(v) ? "—" : (Number.isInteger(v) ? String(v) : v.toFixed(digits));
  const first = entries[0], last = entries[entries.length - 1];

  const deathCauses = header.filter((name) => name.startsWith("pctDeath"));
  const deathRows = deathCauses.map((name) => {
    const share = weightedByDeaths(name);
    const label = name.slice("pctDeath".length).replace(/([a-z])([A-Z])/g, "$1 $2").toLowerCase();
    return `<dt>${label}</dt><dd>${Number.isNaN(share) ? "—" : `${share.toFixed(1)}% (${Math.round((share / 100) * totalDied)})`}</dd>`;
  }).join("");

  // columns that change from row to row go to the table and the chart
  // (with a single row everything is constant, so it all stays in the table)
  const otherColumns = header.filter((name) => !SHOWN_APART.has(name));
  const constantColumns = entries.length < 2 ? [] : otherColumns.filter((name) => !["generation", "step"].includes(name)
    && entries.every((e) => cell(e, name) === cell(first, name)));
  const tableColumns = otherColumns.filter((name) => !constantColumns.includes(name));
  const numericColumns = tableColumns.filter((name) => entries.some((e) => !Number.isNaN(value(e, name))));
  if (!numericColumns.includes(detailMetric)) detailMetric = numericColumns.includes("alive") ? "alive" : numericColumns[0];
  const oldWrap = panel.querySelector(".tableWrap");
  const tableScroll = oldWrap ? [oldWrap.scrollLeft, oldWrap.scrollTop] : [0, 0];

  panel.innerHTML = `
    <h2>Species <span class="mono">${s.id}</span>
      <button data-copy="${s.id}">Copy id</button>
      <button id="detailsCsv">Download its rows</button>
      <button id="detailsClose">Close</button></h2>
    <div class="status">Its lineage is highlighted in the tree. ${s.peak < Math.max(1, Number($("minPeak").value) || 1) ? "It is hidden by the filter." : ""}</div>
    <div class="cols">
      <div><h3>Identity</h3><dl>
        <dt>Genus</dt><dd>${GENUS_LABEL[s.genus] ?? s.genus}</dd>
        <dt>Genome colour</dt><dd><span class="swatch" style="background:${esc(s.color)}"></span><span class="mono">${esc(s.color) || "—"}</span></dd>
        <dt>Genes</dt><dd>${n(s.genomeSize)}</dd>
        <dt>Appeared</dt><dd>generation ${n(s.firstGen)}</dd>
        <dt>First row</dt><dd>generation ${first.row.generation}, step ${first.row.step}</dd>
        <dt>Last row</dt><dd>generation ${last.row.generation}, step ${last.row.step}${value(last, "alive") > 0 ? " (still alive)" : ""}</dd>
        <dt>Rows in the file</dt><dd>${entries.length} in ${genEnds.length} generation${genEnds.length === 1 ? "" : "s"}</dd>
        ${has("simCode") ? `<dt>Run</dt><dd class="mono">${esc(cell(first, "simCode")) || "—"}</dd>` : ""}
      </dl></div>
      <div><h3>Lineage</h3><dl>
        <dt>Came from</dt><dd>${s.parent ? idLink(s.parent) : "root species"}</dd>
        <dt>Ancestors</dt><dd>${ancestors.length}${ancestors.length > 1 ? `<details><summary class="status">show</summary>${ancestors.map(idLink).join("<br>")}</details>` : ""}</dd>
        <dt>Species it gave</dt><dd>${children.length}${children.length ? `<details${children.length <= 5 ? " open" : ""}><summary class="status">most numerous first</summary>${children.slice(0, 200).map((c) => `${idLink(c.id)} <span class="status">${c.peak}</span>`).join("<br>")}${children.length > 200 ? `<br><span class="status">and ${children.length - 200} more</span>` : ""}</details>` : ""}</dd>
        <dt>Descendants</dt><dd>${descendants}</dd>
      </dl></div>
      <div><h3>Over its life</h3><dl>
        <dt>Most at once</dt><dd>${s.peak}</dd>
        ${has("born") ? `<dt>Born</dt><dd>${n(totalBorn)}</dd>` : ""}
        ${has("died") ? `<dt>Died</dt><dd>${n(totalDied)}</dd>` : ""}
        ${has("started") ? `<dt>At its first generation</dt><dd>${n(value(genEnds[0], "started"))} at the start</dd>` : ""}
        ${has("avgAgeAtDeath") ? `<dt>Age at death</dt><dd>${n(weightedByDeaths("avgAgeAtDeath"), 1)} on average</dd>` : ""}
        ${deathRows && totalDied > 0 ? `<dt class="status" style="grid-column: 1 / -1">Causes of death</dt>${deathRows}` : ""}
      </dl></div>
    </div>
    <div class="cols">
      <div><h3>Sensors used</h3>${chips(s.usedSensors)}</div>
      <div><h3>Actions used</h3>${chips(s.usedActions)}</div>
    </div>
    ${s.genome ? `<div><h3>Genome <button data-copy="${esc(s.genome)}">Copy</button></h3><pre class="genome mono">${esc(s.genome)}</pre></div>` : ""}
    ${has("aliveCreatures") && cell(last, "aliveCreatures") ? `<div><h3>Living creatures in its last row</h3><pre class="genome mono">${esc(cell(last, "aliveCreatures").split("|").join(" "))}</pre></div>` : ""}
    ${constantColumns.length ? `<div><h3>The same in every row</h3><div class="constants">${constantColumns.map((name) => `<div><span class="status mono">${name}</span> <span class="mono">${esc(cell(first, name)) || "—"}</span></div>`).join("")}</div></div>` : ""}
    <div>
      <h3>Over time</h3>
      <div class="rowsTools"><label>Column <select id="detailMetric">${numericColumns.map((name) => `<option${name === detailMetric ? " selected" : ""}>${name}</option>`).join("")}</select></label>
        <span class="status">Click a column of the table to draw it; click it again to sort by it.</span></div>
      <svg id="metricChart"></svg>
    </div>
    <div><h3>Every row (${entries.length})</h3><div class="tableWrap"><table id="detailsTable"></table></div></div>`;

  drawMetric(entries, (e) => value(e, detailMetric));
  fillTable(entries, tableColumns, cell, value);
  [panel.querySelector(".tableWrap").scrollLeft, panel.querySelector(".tableWrap").scrollTop] = tableScroll;

  panel.querySelectorAll("[data-species]").forEach((button) => button.addEventListener("click", () => select(button.dataset.species, true)));
  panel.querySelectorAll("[data-copy]").forEach((button) => button.addEventListener("click", () => copy(button.dataset.copy, button)));
  $("detailsClose").addEventListener("click", () => select(null));
  $("detailMetric").addEventListener("input", (event) => { detailMetric = event.target.value; showDetails(); });
  $("detailsCsv").addEventListener("click", () => {
    const text = [header.join(";"), ...entries.map((e) => e.row.cells.join(";"))].join("\n") + "\n";
    const link = document.createElement("a");
    link.href = URL.createObjectURL(new Blob([text], { type: "text/csv" }));
    link.download = `species ${s.id}.csv`;
    link.click();
    setTimeout(() => URL.revokeObjectURL(link.href), 1000);
  });
}

// a line of one column of the species over time
function drawMetric(entries, read) {
  const svg = $("metricChart");
  const width = Math.max(280, svg.clientWidth || $("details").clientWidth - 30);
  const height = 160, m = { left: 48, right: 12, top: 10, bottom: 24 };
  svg.setAttribute("viewBox", `0 0 ${width} ${height}`);
  svg.setAttribute("height", height);
  const points = entries.map((e) => [e.x, read(e)]).filter(([, v]) => !Number.isNaN(v));
  if (points.length === 0) { svg.innerHTML = `<text x="${m.left}" y="${height / 2}" fill="currentColor" opacity="0.6">no values</text>`; return; }
  const xs = points.map((p) => p[0]), vs = points.map((p) => p[1]);
  let minX = Math.min(...xs), maxX = Math.max(...xs);
  if (minX === maxX) { minX -= 0.5; maxX += 0.5; }
  let minV = Math.min(0, ...vs), maxV = Math.max(...vs);
  if (minV === maxV) maxV = minV + 1;
  const sx = (x) => m.left + ((x - minX) / (maxX - minX)) * (width - m.left - m.right);
  const sy = (v) => height - m.bottom - ((v - minV) / (maxV - minV)) * (height - m.top - m.bottom);
  const parts = [`<g class="axis">`];
  for (const t of niceTicks(minX, maxX, Math.floor(width / 80))) {
    parts.push(`<line x1="${sx(t)}" x2="${sx(t)}" y1="${m.top}" y2="${height - m.bottom}"/><text x="${sx(t)}" y="${height - 8}" text-anchor="middle">${t}</text>`);
  }
  for (const v of [minV, (minV + maxV) / 2, maxV]) {
    parts.push(`<line x1="${m.left}" x2="${width - m.right}" y1="${sy(v)}" y2="${sy(v)}"/><text x="${m.left - 6}" y="${sy(v) + 4}" text-anchor="end">${fmtNum(v)}</text>`);
  }
  parts.push("</g>");
  parts.push(`<path class="line" d="M${points.map(([x, v]) => `${sx(x).toFixed(1)},${sy(v).toFixed(1)}`).join("L")}"/>`);
  if (points.length <= 200) for (const [x, v] of points) parts.push(`<circle class="dot" cx="${sx(x).toFixed(1)}" cy="${sy(v).toFixed(1)}" r="2"><title>${fmt(x)}: ${fmtNum(v)}</title></circle>`);
  svg.innerHTML = parts.join("");
}

// every row of the species, every column that is not shown apart
function fillTable(entries, columns, cell, value) {
  const sorted = entries.slice();
  if (detailSort) sorted.sort((a, b) => (value(b, detailSort) || 0) - (value(a, detailSort) || 0));
  const limit = 2000;
  const head = `<tr>${columns.map((name) => `<th class="${name === detailMetric ? "current" : ""}" data-column="${name}">${name}${name === detailSort ? " ▼" : ""}</th>`).join("")}</tr>`;
  const body = sorted.slice(0, limit).map((e) => `<tr>${columns.map((name) => `<td class="${name === detailMetric ? "current" : ""}">${esc(cell(e, name))}</td>`).join("")}</tr>`).join("");
  const table = $("detailsTable");
  table.innerHTML = `<thead>${head}</thead><tbody>${body}</tbody>`
    + (sorted.length > limit ? `<tfoot><tr><td colspan="${columns.length}" style="text-align:left">First ${limit} of ${sorted.length} rows; download them all with Download its rows.</td></tr></tfoot>` : "");
  table.querySelectorAll("th").forEach((th) => th.addEventListener("click", () => {
    const name = th.dataset.column;
    if (name === detailMetric) detailSort = detailSort === name ? null : name;
    else if (entries.some((e) => !Number.isNaN(value(e, name)))) detailMetric = name;
    showDetails();
  }));
}

async function copy(text, button) {
  try {
    await navigator.clipboard.writeText(text);
    const label = button.textContent;
    button.textContent = "Copied";
    setTimeout(() => { button.textContent = label; }, 1200);
  } catch {
    button.textContent = "Cannot copy";
  }
}

const esc = (text) => String(text).replace(/[&<>"]/g, (c) => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;" })[c]);
const fmt = (x) => Number.isInteger(x) ? String(x) : x.toFixed(2);
const fmtNum = (v) => Number.isInteger(v) ? String(v) : Math.abs(v) >= 100 ? v.toFixed(0) : v.toFixed(2);

function el(name, attributes) {
  const node = document.createElementNS(SVG_NS, name);
  for (const [key, value] of Object.entries(attributes)) node.setAttribute(key, value);
  return node;
}

function niceTicks(min, max, count) {
  const span = Math.max(1, max - min);
  const raw = span / Math.max(1, count);
  const step = [1, 2, 5, 10, 20, 25, 50, 100, 200, 250, 500, 1000, 2000, 5000].find((s) => s >= raw) ?? Math.ceil(raw);
  const ticks = [];
  for (let t = Math.ceil(min / step) * step; t <= max; t += step) ticks.push(t);
  return ticks;
}

// -- input
$("file").addEventListener("change", async (event) => {
  const file = event.target.files[0];
  if (file) load(await file.text(), file.name);
});
const drop = $("drop");
drop.addEventListener("dragover", (event) => { event.preventDefault(); drop.classList.add("over"); });
drop.addEventListener("dragleave", () => drop.classList.remove("over"));
drop.addEventListener("drop", async (event) => {
  event.preventDefault();
  drop.classList.remove("over");
  const file = event.dataTransfer.files[0];
  if (file) load(await file.text(), file.name);
});
document.addEventListener("dragover", (event) => event.preventDefault());
document.addEventListener("drop", (event) => event.preventDefault());
for (const id of ["run", "metric", "minPeak", "merge", "scale", "colour", "parentLinks"]) {
  $(id).addEventListener("input", () => { if (rows.length) render(); });
}
$("find").addEventListener("change", (event) => {
  const text = event.target.value.trim().toLowerCase();
  if (!text) return;
  const matches = [...currentSpecies.keys()].filter((id) => id.startsWith(text));
  if (matches.length === 1 || currentSpecies.has(text)) {
    select(currentSpecies.has(text) ? text : matches[0], true);
    event.target.setCustomValidity("");
  } else {
    event.target.setCustomValidity(matches.length ? `${matches.length} species start with it` : "no species with that id");
    event.target.reportValidity();
  }
});
document.addEventListener("keydown", (event) => { if (event.key === "Escape" && selected) select(null); });
let resizeTimer;
window.addEventListener("resize", () => { clearTimeout(resizeTimer); resizeTimer = setTimeout(() => rows.length && render(), 150); });

// ?csv=/path loads a file served by the same site (for example one copied to public/)
const source = new URLSearchParams(location.search).get("csv");
if (source && source.startsWith("/") && !source.startsWith("//")) {
  fetch(source).then((response) => {
    if (!response.ok) throw new Error(`HTTP ${response.status}`);
    return response.text();
  }).then((text) => load(text, source)).catch((error) => { $("fileStatus").textContent = `Cannot load ${source}: ${error.message}.`; });
}
</script>
</body>
</html>
